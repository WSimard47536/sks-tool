[project]
name = "sks-tool"
version = "0.1.0"
description = "Templates and validators for Structured Knowledge Standard (SKS) documents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "WSimard47536", email = "83228735+WSimard47536@users.noreply.github.com" },
]
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.12",
]

[project.scripts]
sks-tool = "sks_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sks_tool"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "--cov=sks_tool --cov-report=term-missing"
testpaths = ["tests"]
